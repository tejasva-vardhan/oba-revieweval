# Research-only golangci-lint configuration for OBA-ReviewEval Phase 6A.
# Do not copy this into OneBusAway/maglev. Maglev has no committed
# .golangci.yml; its Makefile historically invoked `golangci-lint run
# --build-tags sqlite_fts5` with implicit defaults, or later `go vet`.
# This file is a separate, version-controlled research baseline.
#
# Enabled analyzers (only these two):
# - govet: protocol §9 minimum. Default govet analyzers only
#   (printf, atomic, copylocks, lostcancel, loopclosure, ...).
#   Extra govet analyzers such as shadow / fieldalignment are not
#   enabled; they would inflate the baseline with style/nit findings.
# - staticcheck: protocol §9 minimum. Restricted to SA* correctness
#   checks. S* (simplifications), ST* (style), and QF* (quickfixes)
#   are disabled so the baseline is defect-oriented static analysis,
#   not a style suite.
#
# Build tags are passed on the command line from the merge-SHA
# Makefile (sqlite_fts5, and later sqlite_math_functions). They are
# not baked in here so one config hash applies to all 33 PRs.

version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
  settings:
    staticcheck:
      checks:
        - all
        - "-ST*"
        - "-S*"
        - "-QF*"
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 10m
  tests: true
  relative-path-mode: gitroot
  modules-download-mode: readonly
  issues-exit-code: 1

output:
  show-stats: false
